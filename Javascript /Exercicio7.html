<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 7 - Criar Parágrafos</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            gap: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
        }

        #container {
            width: 100%;
            max-width: 500px;
        }

        #container p {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 16px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <button onclick="criarParagrafos()">Criar Parágrafos</button>

    <div id="container"></div>

    <script>
        function criarParagrafos() {
            const container = document.getElementById('container');

            // Limpa parágrafos anteriores (evita duplicar ao clicar várias vezes)
            container.innerHTML = '';

            // Dados de cada parágrafo: texto e cor de fundo
            const paragrafos = [
                { texto: 'Parágrafo com fundo cinza',     cor: 'gray'   },
                { texto: 'Parágrafo com fundo azul',      cor: 'blue'   },
                { texto: 'Parágrafo com fundo amarelo',   cor: 'goldenrod' },
                { texto: 'Parágrafo com fundo vermelho',  cor: 'red'    }
            ];

            // Cria e insere cada parágrafo dinamicamente
            paragrafos.forEach(function(item) {
                const p = document.createElement('p');
                p.textContent = item.texto;
                p.style.backgroundColor = item.cor;
                container.appendChild(p);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Mostrar Mensagem</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .caixa {
            background-color: green;
            border: 6px dashed black;
            padding: 40px;
            display: none;
           
            color: white;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <button onclick="mostrarMensagem()">Mostrar Mensagem</button>
    
    <div id="mensagemDiv" class="caixa">Bem-vindo ao Javascript!</div>
    
    <script>
        function mostrarMensagem() {
            document.getElementById('mensagemDiv').style.display = 'block';
        }
    </script>
</body>
</html>

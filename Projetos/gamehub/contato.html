<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato — GameHub</title>

  <link rel="icon" type="image/png" href="img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">GAME<span>HUB</span></a>

      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="perfil.html">Perfil</a>
        <a href="noticias.html">Notícias</a>
        <a href="contato.html" class="ativo">Contato</a>
      </nav>

      <button class="menu-toggle" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <section class="hero" style="padding: 48px 0;">
    <div class="container" style="grid-template-columns: 1fr; text-align: left;">
      <div>
        <div class="hero-tag">FALE COM A GENTE</div>
        <h1 style="font-size: 36px;">Contato</h1>
        <p>Tem alguma dúvida, sugestão ou problema? Envie uma mensagem para a nossa equipe.</p>
      </div>
    </div>
  </section>

  <section class="secao" style="border-bottom: none;">
    <div class="container">
      <form class="form-contato" id="form-contato">

        <div class="campo">
          <label for="campo-nome">Nome</label>
          <input type="text" id="campo-nome" placeholder="Digite seu nome" />
        </div>

        <div class="campo">
          <label for="campo-email">E-mail</label>
          <input type="email" id="campo-email" placeholder="seuemail@exemplo.com" />
        </div>

        <div class="campo">
          <label for="campo-assunto">Assunto</label>
          <select id="campo-assunto">
            <option value="duvida">Dúvida</option>
            <option value="sugestao">Sugestão</option>
            <option value="problema">Reportar um problema</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="campo">
          <label for="campo-mensagem">Mensagem</label>
          <textarea id="campo-mensagem" placeholder="Escreva sua mensagem aqui..."></textarea>
        </div>

        <button type="submit" class="btn btn-primario">Enviar mensagem</button>

        <p class="mensagem-status" id="status-formulario"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <span>© 2026 GameHub. Projeto desenvolvido para fins de estudo.</span>
      <div class="footer-links">
        <a href="contato.html">Contato</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="perfil.html">Perfil</a>
      </div>
    </div>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/script.js"></script>
</body>
</html>

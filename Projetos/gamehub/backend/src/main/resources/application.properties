# ===================================================================
# CONFIGURAÇÃO DE CONEXÃO COM O BANCO POSTGRESQL REMOTO (NEON / SUPABASE)
# ===================================================================
spring.application.name=gamehub-backend

# Porta do Servidor
server.port=8080

# URL de Conexão JDBC
spring.datasource.url=jdbc:postgresql://ep-bold-glade-a5u9k6t0.us-east-2.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=seu_usuario_remoto
spring.datasource.password=sua_senha_remota
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# CREDENCIAIS OFICIAIS DA API DO IGDB / TWITCH DEVELOPER
# Obtenha gratuitamente em: https://dev.twitch.tv/console/apps
# ===================================================================
igdb.client-id=${IGDB_CLIENT_ID:seu_client_id_aqui}
igdb.client-secret=${IGDB_CLIENT_SECRET:seu_client_secret_aqui}
igdb.api-url=https://api.igdb.com/v4

# Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

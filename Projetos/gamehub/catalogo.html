<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />

  <title>Catálogo — GameHub</title>

  <link rel="icon" type="image/png" href="img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

<body>

  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">GAME<span>HUB</span></a>

      <nav class="nav">
        <a href="index.html">Início</a>
        <a href="catalogo.html" class="ativo">Catálogo</a>
        <a href="perfil.html">Perfil</a>

      <button class="menu-toggle" aria-label="Abrir menu">

        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <section class="hero" style="padding: 48px 0;">
    <div class="container" style="grid-template-columns: 1fr; text-align: left;">
      <div>
        <div class="hero-tag">CATÁLOGO COMPLETO</div>

    </div>

  <section class="secao" style="border-bottom: none;">
    <div class="container">

      <div class="filtros">
        <button class="filtro-btn ativo" data-categoria="todos">Todos</button>
        <button class="filtro-btn" data-categoria="Corrida">Corrida</button>
        <button class="filtro-btn" data-categoria="RPG">RPG</button>

        <button class="filtro-btn" data-categoria="Luta">Luta</button>

      </div>

      <div class="grade-jogos" id="grade-jogos-catalogo"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <span>© 2026 GameHub. Projeto desenvolvido para fins de estudo.</span>
      <div class="footer-links">
        <a href="contato.html">Contato</a>

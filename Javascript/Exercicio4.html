<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Toggle Mensagem</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .caixa {
            background-color: green;
            border: 6px dashed black;
            padding: 40px;
            display: none;
            color: white;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
    <button onclick="alternarMensagem()">Mostrar Mensagem</button>

    <div id="mensagemDiv" class="caixa">Bem-vindo ao Javascript!</div>

    <script>
        function alternarMensagem() {
            const div = document.getElementById('mensagemDiv');
            const botao = document.querySelector('button');

            if (div.style.display === 'block') {
                // Div está visível → esconder
                div.style.display = 'none';
                botao.textContent = 'Mostrar Mensagem';
            } else {
                // Div está oculto → mostrar
                div.style.display = 'block';
                botao.textContent = 'Esconder Mensagem';
            }
        }
    </script>
</body>
</html>
